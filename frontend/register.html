<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Legal AI Assistant</title>
    <link rel="stylesheet" href="./css/themes.css">
    <link rel="stylesheet" href="./css/main.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-main);
        }
        .auth-card {
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .auth-card h2 {
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            text-align: center;
            font-size: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .form-group input {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--accent-color);
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
        .success-msg {
            color: #10a37f;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                    <small style="color: var(--text-secondary); font-size: 0.75rem; margin-top: 4px;">Min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char.</small>
                </div>
                <div id="error-alert" class="error-msg"></div>
                <div id="success-alert" class="success-msg"></div>
                <button type="submit" class="btn-primary" style="margin-top: 1rem;">Register</button>
            </form>
            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>
    <script type="module">
        import { API_BASE } from './js/config.js';

        const form = document.getElementById('register-form');
        const errorAlert = document.getElementById('error-alert');
        const successAlert = document.getElementById('success-alert');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            const full_name = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    let message = 'Registration failed.';
                    if (Array.isArray(data.detail)) {
                        message = data.detail.map(err => err.msg).join(' | ');
                    } else if (typeof data.detail === 'string') {
                        message = data.detail;
                    }
                    throw new Error(message);
                }

                successAlert.textContent = 'Registration successful! Redirecting to login...';
                successAlert.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (err) {
                errorAlert.textContent = err.message;
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
