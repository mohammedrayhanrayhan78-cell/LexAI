name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_legal_ai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Secret Scan (block hardcoded keys)
        run: |
          # Fail if any real API key pattern is found in tracked files
          if git grep -rn \
            -e 'gsk_[A-Za-z0-9]\{30,\}' \
            -e 'AIza[0-9A-Za-z_-]\{30,\}' \
            -e 'sk-[A-Za-z0-9_-]\{30,\}' \
            -- ':!*.env.example' ':!*.md' ':!*.txt'; then
            echo "ERROR: Hardcoded secret detected in source files." && exit 1
          fi
          echo "Secret scan passed."

      - name: Frontend XSS guard (innerHTML must be sanitized)
        run: bash scripts/check_innerhtml.sh

      - name: Run Linting / Flake8
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Smoke Test & Health Check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/test_legal_ai_db
          JWT_SECRET_KEY: ci_test_secret_key_123456789
          JWT_REFRESH_SECRET_KEY: ci_test_refresh_key_123456789
        run: |
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          async def test_db():
              engine = create_async_engine('postgresql+asyncpg://postgres:testpassword@localhost:5432/test_legal_ai_db')
              async with engine.connect() as conn:
                  res = await conn.execute(text('SELECT 1'))
                  assert res.scalar() == 1
              print('Database connection verified successfully.')
          asyncio.run(test_db())
          "

      - name: Run pytest suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/test_legal_ai_db
          JWT_SECRET_KEY: ci_test_secret_key_at_least_32_chars_long
          JWT_REFRESH_SECRET_KEY: ci_refresh_test_key_at_least_32_chars_long
          ENVIRONMENT: development
          GEMINI_API_KEY: fake_gemini_key
          GROQ_API_KEY: fake_groq_key
        run: |
          pip install pytest pytest-asyncio httpx
          cd backend && python -m pytest tests/ -v --tb=short