name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_legal_ai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Linting / Flake8
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Smoke Test & Health Check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/test_legal_ai_db
          JWT_SECRET_KEY: ci_test_secret_key_123456789
          JWT_REFRESH_SECRET_KEY: ci_test_refresh_key_123456789
        run: |
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          async def test_db():
              engine = create_async_engine('postgresql+asyncpg://postgres:testpassword@localhost:5432/test_legal_ai_db')
              async with engine.connect() as conn:
                  res = await conn.execute(text('SELECT 1'))
                  assert res.scalar() == 1
              print('Database connection verified successfully.')
          asyncio.run(test_db())
          "